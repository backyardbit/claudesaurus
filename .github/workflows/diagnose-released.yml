name: Diagnose released formula on macOS

on:
  workflow_dispatch:

jobs:
  released:
    runs-on: macos-latest
    steps:
      - name: Install from the tap
        run: |
          brew tap backyardbit/tap
          brew trust backyardbit/tap || true
          brew install backyardbit/tap/claudesaurus 2>&1 | tail -40
      - name: Version
        if: always()
        run: claudesaurus --version
      - name: Check the bundled Electron
        if: always()
        run: |
          dist="$(brew --prefix claudesaurus)/libexec/node_modules/@zenbu-labs/pixel/electron/dist"
          ls "$dist" || true
          app="$(ls -d "$dist"/*.app | head -1)"
          echo "app: $app"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -15 || true
          codesign -dv "$app" 2>&1 | tail -12 || true
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          "$bin" --version || echo "electron exited with $?"
      - name: Launch in a pseudo-terminal
        if: always()
        run: |
          mkdir -p work && cd work
          (script -q /dev/null claudesaurus > ../launch.log 2>&1 &) ; sleep 25
          pkill -f claudesaurus || true
          tail -c 3000 ../launch.log | cat -v | tail -40
          tail -40 ~/Library/Logs/pixel/*.log 2>/dev/null || ls ~/.local/state/pixel/logs 2>/dev/null || true
